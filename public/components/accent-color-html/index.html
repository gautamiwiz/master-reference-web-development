<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML accent color</title>

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
    <meta name="theme-color" content="#0095da" />
    <style>
      form:not(:last-child) {
        margin-bottom: 2rem;
        border-bottom: 1px solid #efefef;
        padding-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <main style="max-width: 800px; margin: 0 auto">
      <form action="" style="accent-color: red">
        <div>
          <input type="range" />
        </div>
        <div style="padding-block: 1rem">
          <input type="radio" name="fruit" /> Option 1
          <input type="radio" name="fruit" /> Option 2
          <input type="radio" name="fruit" /> Option 3
        </div>
        <div>
          <input type="checkbox" /> Checkbox 1 <br />
          <input type="checkbox" /> Checkbox 2 <br />
          <input type="checkbox" /> Checkbox 3
        </div>
      </form>
      <form action="" style="accent-color: purple">
        <div>
          <input type="range" />
        </div>
        <div style="padding-block: 1rem">
          <input type="radio" name="fruit" /> Option 1
          <input type="radio" name="fruit" /> Option 2
          <input type="radio" name="fruit" /> Option 3
        </div>
        <div>
          <input type="checkbox" /> Checkbox 1 <br />
          <input type="checkbox" /> Checkbox 2 <br />
          <input type="checkbox" /> Checkbox 3
        </div>
      </form>
      <form action="" style="accent-color: green">
        <div>
          <input type="range" />
        </div>
        <div style="padding-block: 1rem">
          <input type="radio" name="fruit" /> Option 1
          <input type="radio" name="fruit" /> Option 2
          <input type="radio" name="fruit" /> Option 3
        </div>
        <div>
          <input type="checkbox" /> Checkbox 1 <br />
          <input type="checkbox" /> Checkbox 2 <br />
          <input type="checkbox" /> Checkbox 3
        </div>
      </form>
    </main>
  </body>
</html>
