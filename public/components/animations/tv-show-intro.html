<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Intro</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        place-items: center;
        background: #050505;
      }

      .show {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #050505;
      }

      .show img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        animation: tv-intro 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes tv-intro {
        0% {
          clip-path: inset(50% 0);
          opacity: 0;
          transform: scale(1.25);
          filter: brightness(2) blur(4px);
        }

        12% {
          opacity: 1;
        }

        65% {
          clip-path: inset(0);
          filter: brightness(1) blur(0);
        }

        100% {
          clip-path: inset(0);
          opacity: 1;
          transform: scale(1);
          filter: brightness(1) blur(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .show img {
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="show">
      <img src="../../images/gallery-images/9.jpg" alt="White tiger in water" />
    </div>
  </body>
</html>
