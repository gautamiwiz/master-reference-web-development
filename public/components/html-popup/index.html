<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Popup</title>
  </head>
  <body>
    <h1>HTML Popup</h1>
    <button popovertarget="my-popup">Open POPUP</button>
    <div id="my-popup" popover>
      <h2>Popup title</h2>
      <button popovertarget="my-popup" popovertargetaction="hide">Close</button>
    </div>
  </body>
</html>
